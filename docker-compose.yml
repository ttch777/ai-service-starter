services:
  api:
    build: .
    image: ai-service-starter:0.1.0
    container_name: ai-service-starter
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      CONFIG_PATH: config/models.yaml
      LOG_LEVEL: INFO
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
